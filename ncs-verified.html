<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>정보보안산업기사 V1 · NCS 실전형 모의고사</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#f2f6fa;color:#1d2b3a;margin:0;line-height:1.6}header{background:#123353;color:white;padding:25px 16px}main{max-width:840px;margin:auto;padding:16px}h1{font-size:1.45rem;margin:0}h2{font-size:1.2rem}button,select{font:inherit;border:1px solid #bbc8d5;border-radius:10px;padding:11px;background:white;color:#123353;cursor:pointer}button:focus-visible{outline:3px solid #2688ce}.bar{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}.panel{background:white;border:1px solid #d9e1e9;border-radius:14px;padding:18px;margin:15px 0}.small{color:#536578;font-size:.85rem}.term{font-size:1.25rem;font-weight:750}.ans{display:none;border-top:1px solid #dbe2e9;margin-top:15px;padding-top:12px}.ans.show{display:block}.choice{display:block;width:100%;text-align:left;margin:9px 0}.choice.ok{border:2px solid #247a5b;background:#e7f6ed}.choice.no{border:2px solid #b64c4c;background:#fff0f0}.notice{background:#fff7e5;border-left:4px solid #ad7722;padding:12px;margin-top:14px}a{color:#1767a8}header a{color:white}</style></head><body><header><h1>정보보안산업기사 V1 · NCS 모의고사</h1><div>NCS 원문 대조 · 7개 학습모듈 · 21문항</div><a href="./index.html">홈으로</a></header><main><div class="notice">NCS 학습모듈을 바탕으로 만든 21문항 4지택일 모의고사입니다. 공식 기출문제가 아니며, 기존 90문항·171개 암기 카드의 전체 검증 완료본도 아닙니다. 정답 확인 시 해당 PDF 근거 페이지를 표시합니다.</div><div class="bar"><button onclick="restart()">새 모의고사 시작</button><button onclick="showResult()">점수 확인</button><select id="topic" onchange="answers={};idx=0;render()"><option value="all">전체 능력단위</option><option>SW개발 보안 구축</option><option>시스템 보안 구축</option><option>NW보안 구축</option><option>네트워크 보안 운영</option><option>애플리케이션 보안 운영</option><option>시스템 보안 운영</option><option>보안로그 분석</option></select></div><div id="view"></div></main><script>const data=[{"id":1,"topic":"SW개발 보안 구축","page":16,"term":"자산(Asset)","definition":"조직 또는 기관이 보유하는 정보화 자산과 데이터","wrong":["위협원","위협","취약점"],"source":"LM2001020611_19v5"},{"id":2,"topic":"SW개발 보안 구축","page":16,"term":"위협원(Threat agents)","definition":"자산에 피해를 줄 수 있는 내·외부 공격 위험 주체","wrong":["자산","위협","위험"],"source":"LM2001020611_19v5"},{"id":3,"topic":"SW개발 보안 구축","page":16,"term":"위협(Threat)","definition":"자산에 피해를 주는 위협원의 공격 행동","wrong":["자산","위협원","취약점"],"source":"LM2001020611_19v5"},{"id":4,"topic":"시스템 보안 구축","page":16,"term":"패스워드 인증","definition":"입력된 사용자 ID와 패스워드를 등록된 정보와 대조하여 접속 허용 여부를 판단","wrong":["로그 분석","네트워크 분리","백업"],"source":"LM2001020613_19v5"},{"id":5,"topic":"시스템 보안 구축","page":17,"term":"로그 관리","definition":"시스템에 영향을 미치는 사항을 기록하여 문제 해결과 예방 활동에 활용","wrong":["권한 부여","서비스 제거","망분리"],"source":"LM2001020613_19v5"},{"id":6,"topic":"시스템 보안 구축","page":17,"term":"취약점(Vulnerability)","definition":"공격자가 시스템의 정보보안을 낮추는 데 사용할 수 있는 약점","wrong":["가용성","정상 탐지","인증 정보"],"source":"LM2001020613_19v5"},{"id":7,"topic":"NW보안 구축","page":36,"term":"물리적 망분리","definition":"별도 PC와 회선을 사용하여 내부망과 외부망을 분리","wrong":["논리적 망분리","가상사설망","패킷 필터링"],"source":"LM2001020614_19v5"},{"id":8,"topic":"NW보안 구축","page":36,"term":"논리적 망분리","definition":"가상화 기술 등을 이용해 한 대의 PC에서 내부망과 외부망을 분리","wrong":["물리적 망분리","방화벽 정책","백업"],"source":"LM2001020614_19v5"},{"id":9,"topic":"NW보안 구축","page":31,"term":"네트워크 접속 제한","definition":"IP 주소 등으로 시스템 접속 권한을 제한하여 비인가 접근을 막는 보안 요구사항","wrong":["로그 삭제","권한 무제한 부여","보안 설정 해제"],"source":"LM2001020614_19v5"},{"id":10,"topic":"네트워크 보안 운영","page":26,"term":"MAN","definition":"LAN보다 크고 WAN보다 작은 도시 규모의 통신망","wrong":["LAN","WAN","PAN"],"source":"LM2001060108_19v3"},{"id":11,"topic":"네트워크 보안 운영","page":26,"term":"WAN","definition":"국가나 대륙 등 넓은 지역을 연결하는 광역 통신망","wrong":["LAN","MAN","PAN"],"source":"LM2001060108_19v3"},{"id":12,"topic":"네트워크 보안 운영","page":36,"term":"스크리닝 라우터","definition":"송수신지 주소, 프로토콜, 포트 등을 분석해 패킷 통과를 허가하거나 거절하는 라우터","wrong":["웹 애플리케이션 방화벽","인증 서버","백업 서버"],"source":"LM2001060108_19v3"},{"id":13,"topic":"애플리케이션 보안 운영","page":17,"term":"보안 요구사항 정의서","definition":"애플리케이션 구조와 보안 솔루션 현황을 파악하고 보안 요구사항을 정리한 문서","wrong":["침해사고 보고서","로그 삭제 내역","패치 설치 파일"],"source":"LM2001060109_19v3"},{"id":14,"topic":"애플리케이션 보안 운영","page":36,"term":"보안 설정 변경","definition":"알려진 취약점의 개선을 위해 적용할 수 있는 보안 조치 방법","wrong":["취약점 방치","로그 비활성화","무조건적 접근 허용"],"source":"LM2001060109_19v3"},{"id":15,"topic":"애플리케이션 보안 운영","page":36,"term":"보안 패치 적용","definition":"알려진 취약점의 개선을 위해 업데이트를 적용하는 조치","wrong":["계정 공유","기록 삭제","접근 통제 해제"],"source":"LM2001060109_19v3"},{"id":16,"topic":"시스템 보안 운영","page":26,"term":"예방 대응","definition":"보안 위협과 위험을 사전에 예방하기 위한 대응 활동","wrong":["사후 보고만 수행","로그 무조건 삭제","관리자 계정 공유"],"source":"LM2001060110_19v3"},{"id":17,"topic":"시스템 보안 운영","page":26,"term":"탐지 대응","definition":"보안 사고 탐지를 위한 활동 지표와 사전 대응 매뉴얼에 따라 조치","wrong":["예산 편성만 수행","백업 삭제","접근 통제 해제"],"source":"LM2001060110_19v3"},{"id":18,"topic":"시스템 보안 운영","page":41,"term":"시스템 보안 진단 절차","definition":"대상 식별, 인벤토리 스캐닝, 취약점 점검, 상세 점검, 보고서 작성의 순서","wrong":["백업, 복원, 폐기","설계, 구매, 폐기","계정 생성, 삭제만 수행"],"source":"LM2001060110_19v3"},{"id":19,"topic":"보안로그 분석","page":16,"term":"침해대응 절차","definition":"보안사고 발생 시 대응하는 일련의 과정과 수행 행동","wrong":["망분리 구축 절차","일반 개발 배포 절차","자산 구매 절차"],"source":"LM2001060307"},{"id":20,"topic":"보안로그 분석","page":26,"term":"정탐","definition":"보안사고를 정해진 규칙에 따라 정상적으로 탐지하고 분석 결과를 올바르게 판정한 경우","wrong":["오탐","미탐","로그 손실"],"source":"LM2001060307"},{"id":21,"topic":"보안로그 분석","page":26,"term":"오탐","definition":"보안사고가 아닌데 사고로 탐지하거나 침해사건을 사고가 아니라고 잘못 판정한 경우","wrong":["정탐","자산 식별","로그 보관"],"source":"LM2001060307"}];let mode='quiz',idx=0,selected=false;let answers={};function pool(){let t=document.getElementById('topic').value;return data.filter(x=>t==='all'||x.topic===t)}function render(){const a=pool();idx=Math.max(0,Math.min(idx,a.length-1));const x=a[idx],v=document.getElementById('view');if(!x){v.textContent='자료 없음';return}const source='<p class="small">NCS '+x.topic+' ('+x.source+') · PDF '+x.page+'쪽</p>';const common='<div class="bar"><button onclick="idx=Math.max(0,idx-1);render()">이전</button><button onclick="idx=Math.min(pool().length-1,idx+1);render()">다음</button></div>';const opts=[x.term,...x.wrong].map((s,i)=>({s,key:i})).sort((a,b)=>((a.key*13+x.id*7)%17)-((b.key*13+x.id*7)%17));const done=Object.prototype.hasOwnProperty.call(answers,x.id);v.innerHTML='<div class="panel"><div class="small">문항 '+(idx+1)+' / '+a.length+' · 답안 '+Object.keys(answers).length+'개 제출</div><p class="term">'+x.definition+'</p><p>설명에 해당하는 용어는?</p>'+opts.map(o=>'<button class="choice '+(done&&answers[x.id]===o.key?(o.key===0?'ok':'no'):'')+'" '+(done?'disabled':'')+' onclick="judge(this,'+o.key+')">'+o.s+'</button>').join('')+'<div class="ans '+(done?'show':'')+'" id="answer"><b>정답: '+x.term+'</b>'+source+'</div></div>'+common}function judge(el,key){const x=pool()[idx];answers[x.id]=key;document.querySelectorAll('.choice').forEach(b=>b.disabled=true);el.classList.add(key===0?'ok':'no');document.getElementById('answer').classList.add('show')}function restart(){answers={};idx=0;render()}function showResult(){const a=pool();const correct=a.filter(x=>answers[x.id]===0).length;const attempted=a.filter(x=>Object.prototype.hasOwnProperty.call(answers,x.id)).length;document.getElementById('view').innerHTML='<div class="panel"><h2>모의고사 결과</h2><p class="term">'+Math.round(correct/a.length*100)+'점</p><p>정답 '+correct+' / '+a.length+'문항 · 응시 '+attempted+'문항</p><p class="small">미응시 문항은 오답으로 처리했습니다. 이 점수는 실제 과정평가형 외부평가 점수가 아닙니다.</p><button onclick="idx=0;render()">문제 다시 보기</button><button onclick="restart()">새 시험</button></div>'}render();</script></body></html>
