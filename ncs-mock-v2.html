<script>
'use strict';
const D=JSON.parse(document.getElementById('exam-data').textContent), KEY='security-v1-ncs-merged-session-v2', HISTORY_KEY='security-v1-ncs-merged-results-v2', WRONG_KEY='security-v1-ncs-merged-wrong-v2';
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stored=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}};
let appState=stored(KEY,null), history=stored(HISTORY_KEY,[]), wrong=stored(WRONG_KEY,{}), screen='home', selectedStage=1, selectedMode='exam', current=0, showSolution=false, tick=null, picker=false, result=null;
const save=()=>{if(appState)localStorage.setItem(KEY,JSON.stringify(appState));else localStorage.removeItem(KEY)};
function toast(s){$('toast-container').innerHTML='<div class="toast">'+esc(s)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast-container').innerHTML='',2400)}
function questions(stage){return stage===1?D.first:D.second}
function answer(q){return appState?.answers?.[q.id]}
function filled(q){let a=answer(q);if(q.type==='연결형')return Array.isArray(a)&&a.length===3&&a.every(Boolean);return a!==undefined&&a!==null&&String(a).trim()!==''}
function stageName(stage){return stage===1?'1차 기본개념 확인':'2차 기본개념 확인'}
function normalize(s){return String(s??'').normalize('NFKC').toLowerCase().replace(/[\s\p{P}\p{S}]/gu,'')}
function aliases(q){let a=[q.answer,...(q.accept||[])];const dict={'입력값 검증':['입력 검증','입력값검사','입력 데이터 검증'],'접근통제':['접근 제어','접근통제'], 'DMZ':['비무장지대'],'DDoS':['분산 서비스 거부 공격','분산서비스거부공격'],'보안 패치':['패치','보안패치'], '백업':['Backup'], 'SIEM':['보안 정보 및 이벤트 관리','통합보안관제시스템'],'ACL':['접근통제 목록','접근 제어 목록','Access Control List'],'취약점 진단':['취약성 진단'], '변경 관리':['변경관리']};return a.concat(dict[q.answer]||[])}
function isCorrect(q,a){if(!filled(q))return false;if(q.type==='연결형')return a?.every((v,i)=>v===q.match[i]);if(q.type==='단답형')return aliases(q).some(v=>normalize(v)===normalize(a));if(q.type==='보기 선택')return Number(a)===q.answerIndex;if(q.type==='4지택일')return String(a||'').startsWith(q.answer+' ');return a===q.answer}
function points(q,stage){return stage===2?5:q.id<=30?2:4}
function getResult(stage,answers,overrides={}){const qq=questions(stage);let total=0,correct=0,answered=0;let items=qq.map(q=>{let a=answers[q.id], has=q.type==='연결형'?Array.isArray(a)&&a.length===3&&a.every(Boolean):a!==undefined&&a!==null&&String(a).trim()!=='';let ok=(overrides[q.id]??false)||isCorrectFor(q,a);if(ok){total+=points(q,stage);correct++}if(has)answered++;return{q,a,ok,has,pts:points(q,stage)}});return{total,correct,answered,items,max:100,stage}}
function isCorrectFor(q,a){if(q.type==='연결형')return Array.isArray(a)&&a.length===3&&a.every(Boolean)&&a.every((v,i)=>v===q.match[i]);if(q.type==='단답형')return !!String(a??'').trim()&&aliases(q).some(v=>normalize(v)===normalize(a));if(q.type==='보기 선택')return Number(a)===q.answerIndex;if(q.type==='4지택일')return String(a||'').startsWith(q.answer+' ');return a===q.answer}
function scrollTop(){window.scrollTo({top:0,behavior:'instant'})}
function go(where){clearInterval(tick);tick=null;picker=false;screen=where;scrollTop();render()}
function init(){if(appState&&!appState.finished){selectedStage=appState.stage;selectedMode=appState.mode;current=appState.current||0;go('exam')}else go('home')}
function setup(stage){selectedStage=stage;selectedMode='exam';go('setup')}
function setMode(v){selectedMode=v;render()}
function start(){let saved=appState&&!appState.finished&&appState.stage===selectedStage;if(saved&&appState.mode===selectedMode){current=appState.current||0;go('exam');return}if(appState&&!appState.finished&&Object.keys(appState.answers||{}).length&& !confirm('기존에 풀던 시험이 있습니다. 새 시험을 시작하면 현재 답안이 삭제됩니다. 계속하시겠습니까?'))return;appState={stage:selectedStage,mode:selectedMode,started:Date.now(),answers:{},current:0,finished:false};current=0;showSolution=false;save();go('exam')}
function choose(v){if(!appState)return;const q=questions(appState.stage)[current];appState.answers[q.id]=v;save();render()}
function matchPick(i,v){let q=questions(appState.stage)[current],a=Array.isArray(answer(q))?[...answer(q)]:['','',''];a[i]=v;choose(a)}
function nav(i){current=Math.max(0,Math.min(questions(appState.stage).length-1,i));appState.current=current;save();showSolution=false;picker=false;scrollTop();render()}
function fmt(seconds){let h=Math.floor(seconds/3600),m=Math.floor(seconds%3600/60),s=seconds%60;return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function remain(){return Math.max(0,5400-Math.floor((Date.now()-appState.started)/1000))}
function ensureTimer(){clearInterval(tick);if(!appState||appState.mode!=='exam')return;tick=setInterval(()=>{if(screen!=='exam'||!appState)return;let t=remain(),node=$('timer');if(node){node.textContent=fmt(t);node.classList.toggle('urgent',t<=600)}if(t<=0)finish(true)},1000)}
function home(){const resume=appState&&!appState.finished;const card=(stage,num,desc)=>`<article class="exam-card"><div class="mini"><span class="exam-badge">${stage}차 평가</span><span style="font-size:11px;color:#8492a1">V1 연습용</span></div><div><div class="number">${num}<span style="font-size:16px;letter-spacing:0;color:#52677b">문항</span></div><h3>${stage===1?'객관식·단답형':'통합 보기 필답형'}</h3><p>${desc}</p></div><div class="chips"><span class="chip">90분</span><span class="chip">100점</span><span class="chip">${stage===1?'4지·OX·연결·단답':'보기 39개 제공'}</span></div><button class="btn primary full" onclick="setup(${stage})">${resume&&appState.stage===stage?'시험 선택 · 이어 풀기 가능':'모의고사 시작하기'} <span aria-hidden="true">→</span></button></article>`;
return `<section class="paper-panel" style="border-left:4px solid var(--accent);margin-bottom:14px"><b>NCS 핵심용어 · 기본개념 중심</b><p>첨부하신 <b>하~중하 60문항</b>을 기존 사이트의 실전·학습 모드에 통합했습니다. <b>NCS 학습모듈의 평가 부분은 문제 소재에서 제외</b>했습니다. 정보시스템 진단은 16v1 사진 교재를 참고하며, 2026 출제기준의 19v2와 다릅니다.</p><div class="inline-actions"><a class="btn outline btn-small" href="./index.html">공개 예시</a><a class="btn outline btn-small" href="./plan.html">공부계획</a><a class="btn outline btn-small" href="./ncs-mock-previous.html">이전 70·65점 기록·해설</a></div></section><section class="hero"><div class="eyebrow">SECURITY CERTIFICATION · V1</div><h1>문제를 풀며 완성하는<br>정보보안 실전 감각</h1><p>첨부 HTML의 용어·기본개념 문제를 기존 타이머·자동채점·오답복습과 결합했습니다. 관련 학습내용과 수행준거를 문항마다 표시합니다.</p><div class="tagrow"><span class="tag">1차 40문항</span><span class="tag">2차 20문항</span><span class="tag">자동 채점</span><span class="tag">오답 저장</span></div></section>${resume?`<div class="paper-panel" style="border-left:4px solid var(--accent)"><h3>풀던 시험이 남아 있습니다 · ${appState.stage}차</h3><p>현재까지 ${Object.keys(appState.answers).length}문항에 답했습니다. 이 기기에서 계속 풀 수 있습니다.</p><div class="inline-actions"><button class="btn primary btn-small" onclick="selectedStage=${appState.stage};selectedMode='${appState.mode}';go('exam')">이어서 풀기</button><button class="btn outline btn-small" onclick="if(confirm('진행 중인 답안이 삭제됩니다.')){appState=null;save();go('home')}">진행 기록 지우기</button></div></div>`:''}<div class="section-heading"><h2>시험 선택</h2><span>전체 문제 60문항</span></div><div class="exam-grid">${card(1,40,'4지택일 20 · O/X 5 · 연결형 5 · 단답형 10')}${card(2,20,'39개 통합 보기에서 정답을 선택하는 필답형')}</div><div class="paper-panel"><h3>학습 기록과 오답노트</h3><p>채점한 시험은 기기에 기록됩니다. 잘못 선택한 문항과 관련 수행준거를 다시 확인할 수 있습니다.</p><div class="inline-actions"><button class="btn ghost btn-small" onclick="go('history')">성적 기록 보기</button><button class="btn outline btn-small" onclick="go('wrong')">오답노트 열기 · ${Object.keys(wrong).length}문항</button></div></div>`}
function setupPage(){const resume=appState&&!appState.finished&&appState.stage===selectedStage;return `<section class="setup"><button class="back" onclick="go('home')">← 홈으로</button><h1>${stageName(selectedStage)}</h1><p>${selectedStage===1?'객관식 30문항과 주관식 10문항으로 구성한 모의고사입니다.':'39개 통합 보기에서 가장 적절한 답을 선택하는 모의고사입니다.'}</p><div class="panel"><h3>시험 방식 선택</h3><div class="toggle-row"><button class="mode-btn ${selectedMode==='exam'?'selected':''}" onclick="setMode('exam')"><b>⏱ 실전 모드</b><span>90분 제한 · 종료 후 전체 해설</span></button><button class="mode-btn ${selectedMode==='learn'?'selected':''}" onclick="setMode('learn')"><b>📖 학습 모드</b><span>시간 제한 없이 필요한 문제 해설 확인</span></button></div><div class="overview"><div><strong>${selectedStage===1?40:20}</strong><small>전체 문항</small></div><div><strong>100점</strong><small>연습용 만점</small></div><div><strong>${selectedMode==='exam'?'90분':'무제한'}</strong><small>풀이 시간</small></div></div><button class="btn primary full" onclick="start()">${resume&&selectedMode===appState.mode?'기존 시험 이어서 풀기':'시험 시작'}</button><div class="notice">진행 답안은 현재 기기의 브라우저에 자동 저장됩니다. 단, 시크릿 모드·기기 변경·브라우저 데이터 삭제 시 기록이 사라질 수 있습니다. 시험지의 배점과 2차 보기 구성은 자체 연습용입니다.</div></div></section>`}
function questionWidget(q){let a=answer(q);
if(q.type==='4지택일'||q.type==='진위형')return `<div class="choice-list">${q.choices.map(c=>`<button type="button" class="choice ${a===c?'selected':''}" onclick="choose(${JSON.stringify(c).replace(/"/g,'&quot;')})"><span class="bullet">${c.slice(0,1)}</span><span>${esc(c.slice(2))}</span></button>`).join('')}</div>`;
if(q.type==='연결형')return `<div class="q-hint">아래 각 항목에 해당하는 설명 기호를 선택하세요. 3개 모두 맞혀야 정답으로 처리합니다.</div><div>${q.pairs[0].map((v,i)=>`<label class="match-row"><span>${esc(v)}</span><select onchange="matchPick(${i},this.value)"><option value="">답 선택</option>${q.pairs[1].map((x,j)=>`<option value="${['㉠','㉡','㉢'][j]}" ${Array.isArray(a)&&a[i]===['㉠','㉡','㉢'][j]?'selected':''}>${['㉠','㉡','㉢'][j]} 선택</option>`).join('')}</select></label>`).join('')}</div><div class="match-bank">${q.pairs[1].map(v=>`<div>${esc(v)}</div>`).join('')}</div>`;
if(q.type==='단답형')return `<label class="q-hint" for="shortanswer">정확한 보안 용어 또는 약어를 입력하세요.</label><input autocomplete="off" autocorrect="off" class="input-answer" id="shortanswer" aria-label="단답형 답안 입력" type="text" placeholder="여기에 답안을 입력" value="${esc(a||'')}"><div class="q-hint">입력 내용은 자동 저장됩니다. 띄어쓰기는 채점에 영향을 주지 않습니다.</div>`;
if(q.type==='보기 선택')return `<div class="q-hint">아래 보기 목록에서 정답 번호를 하나 선택하세요.</div><details class="bank-card" id="bankdetails" ${!a?'open':''}><summary>통합 보기 39개 펼치기 ▾</summary><div class="bank-body"><input class="bank-search" id="banksearch" type="search" placeholder="보기 번호 또는 용어 검색" oninput="filterBank(this.value)" aria-label="통합 보기 검색"><div class="bank-grid" id="bank-options">${bankButtons(q,a)}</div></div></details>${a?`<div class="selected-bank"><div><b>선택: ${a}번</b><br>${esc(D.bank[Number(a)-1])}</div><button onclick="choose('')">선택 해제</button></div>`:''}`;
return ''}
function bankButtons(q,a,filter=''){return D.bank.map((v,i)=>({v,n:i+1})).filter(({v,n})=>(`${n} ${v}`).toLowerCase().includes(filter.trim().toLowerCase())).map(({v,n})=>`<button type="button" class="bank-option ${Number(a)===n?'chosen':''}" onclick="choose(${n})"><b>${String(n).padStart(2,'0')}</b> ${esc(v)}</button>`).join('')||'<div class="q-hint">검색 결과가 없습니다.</div>'}
function filterBank(s){const q=questions(appState.stage)[current];$('bank-options').innerHTML=bankButtons(q,answer(q),s)}
function renderNumButtons(){const q=questions(appState.stage);return q.map((v,i)=>`<button title="${i+1}번 문제" class="num-btn ${filled(v)?'filled':''} ${i===current?'active':''}" onclick="nav(${i})">${i+1}</button>`).join('')}
function examPage(){if(!appState||appState.finished)return home();if(appState.mode==='exam'&&remain()===0){setTimeout(()=>finish(true),0);return '<div class="panel">시험 시간이 종료되어 채점하고 있습니다.</div>'}let stage=appState.stage,qs=questions(stage),q=qs[current],count=qs.filter(filled).length,pct=Math.round(count/qs.length*100);return `<div class="exam-head"><div><div class="caption">${stageName(stage)} · ${appState.mode==='exam'?'실전 모드':'학습 모드'}</div><h1>${stage===1?'1차':'2차'} NCS 하~중하 실전 모의고사</h1></div>${appState.mode==='exam'?`<div class="timer" id="timer">${fmt(remain())}</div>`:`<span class="timer" style="font-size:12px">시간 무제한</span>`}</div><div class="bar"><i style="width:${pct}%"></i></div><div class="progress-info"><span>${count}/${qs.length}문항 답변 완료</span><span>${pct}% 진행</span></div><div class="quiz-layout"><section><div class="panel question-panel"><div class="question-top"><span class="q-index">QUESTION ${String(q.id).padStart(2,'0')} / ${qs.length}</span><span class="q-tag">${esc(q.type)}</span><span class="q-tag">${esc(q.topic)}</span><span class="q-tag">${esc(q.level)} · 수행준거 ${esc(q.code)}</span></div><h2 class="stem">${esc(q.stem)}</h2>${questionWidget(q)}<p style="font-size:12px;color:#536f80;margin-top:10px">📘 관련 학습내용: ${esc(q.ncsSource.module)}${q.ncsSource.page?" · 교재 "+esc(q.ncsSource.page)+"쪽":""} (${esc(q.ncsSource.origin)})</p>${appState.mode==='learn'?`<div class="inline-actions"><button class="btn ghost btn-small" onclick="showSolution=!showSolution;render()">${showSolution?'해설 접기':'정답과 해설 확인'}</button></div>${showSolution?explanation(q):''}`:''}<div class="nav-footer"><button class="btn outline" onclick="nav(${current-1})" ${current===0?'disabled':''}>← 이전</button><div class="q-counter">${current+1} / ${qs.length}</div><button class="btn primary" onclick="nav(${current+1})" ${current===qs.length-1?'disabled':''}>다음 →</button></div></div><div class="submit-section"><button class="btn outline" onclick="finish(false)">시험 제출하고 채점하기</button></div></section><aside class="panel side"><div class="side-title">문제 이동</div><p>답변한 문제는 초록색으로 표시됩니다.</p><div class="num-grid">${renderNumButtons()}</div><div class="side-legend"><i class="legend-dot"></i>답변 완료 · 선택하면 해당 문제 이동</div></aside></div><div class="mobile-footer"><button class="btn outline" onclick="nav(${current-1})" ${current===0?'disabled':''}>← 이전</button><button class="btn ghost" onclick="picker=!picker;render()">문제 ${current+1}/${qs.length} ▦</button><button class="btn primary" onclick="nav(${current+1})" ${current===qs.length-1?'disabled':''}>다음 →</button></div>${picker?`<div class="num-picker"><div class="side-title" style="margin-bottom:12px">풀 문제 선택 · ${count}/${qs.length}완료</div><div class="num-grid">${renderNumButtons()}</div><button class="btn btn-small outline full" style="margin-top:14px" onclick="picker=false;render()">닫기</button></div>`:''}`}
function explanation(q){return `<div class="explanation"><div class="hd">정답과 해설</div><strong>${esc(q.type==='보기 선택'?`${q.answerIndex}번 · ${q.answer}`:q.answer)}</strong><p>${esc(q.why)}</p><p>오답 구별: ${esc(q.wrong)}</p><small>${esc(q.topic)} &gt; ${esc(q.sub)} · 수행준거 ${esc(q.crit)}<br>관련 학습내용: ${esc(q.ncsSource.module)}${q.ncsSource.page?" · 교재 "+esc(q.ncsSource.page)+"쪽":""} (${esc(q.ncsSource.origin)})<br>필수 기억: ${esc(q.memo)}</small></div>`}
function finish(auto){if(!appState||appState.finished)return;const stage=appState.stage,qs=questions(stage),count=qs.filter(filled).length;if(!auto&&!confirm(`답변 ${count}/${qs.length}문항입니다. 지금 제출하여 채점하시겠습니까?`))return;let r=getResult(stage,appState.answers),record={stage,mode:appState.mode,finished:Date.now(),score:r.total,correct:r.correct,answered:r.answered,answers:structuredClone(appState.answers),overrides:{},id:Date.now().toString()};for(let it of r.items){let key=`${stage}-${it.q.id}`;if(!it.ok)wrong[key]={stage,id:it.q.id,mine:it.a,when:Date.now()};else delete wrong[key]};localStorage.setItem(WRONG_KEY,JSON.stringify(wrong));history.unshift(record);history=history.slice(0,30);localStorage.setItem(HISTORY_KEY,JSON.stringify(history));appState=null;save();result=record;go('result');toast(auto?'90분이 지나 자동으로 제출되었습니다.':'채점이 완료되었습니다.')}
function displayAnswer(q,a){if(a===undefined||a===null||a===''||Array.isArray(a)&&a.every(v=>!v))return '미응답';if(q.type==='연결형')return a.map((v,i)=>`①②③`[i]+'-'+(v||'?')).join(', ');if(q.type==='보기 선택')return `${a}번 · ${D.bank[Number(a)-1]??'미선택'}`;return String(a)}
function resultPage(){if(!result)return historyPage();let r=getResult(result.stage,result.answers,result.overrides||{}),miss=r.items.filter(it=>!it.ok);return `<section class="result-hero"><div class="eyebrow">EXAM FINISHED · ${result.stage}차</div><h1>${stageName(result.stage)} 채점 결과</h1><div class="score">${r.total}<span> / 100점</span></div><p>${result.mode==='exam'?'90분 실전 모드':'시간 무제한 학습 모드'} · 자체 연습용 채점 결과</p></section><div class="result-details"><div class="panel"><strong>${r.correct}</strong><small>정답 문항</small></div><div class="panel"><strong>${r.items.length-r.correct}</strong><small>오답·미응답</small></div><div class="panel"><strong>${r.answered}</strong><small>답변한 문항</small></div></div><div class="paper-panel"><h3>${miss.length?'오답 해설 확인':'모든 문제를 맞혔습니다!'}</h3><p>정답과 수행준거를 확인하세요. 단답형은 동의어·표기 차이 때문에 자동 채점이 일부 다를 수 있으므로 수동 정정 기능을 제공합니다.</p><div class="inline-actions"><button class="btn primary btn-small" onclick="setup(${result.stage})">같은 회차 다시 풀기</button><button class="btn outline btn-small" onclick="go('history')">전체 학습 기록</button><button class="btn outline btn-small" onclick="go('wrong')">오답노트</button></div></div><div class="section-heading"><h2>문항별 정답 및 해설</h2><span>${miss.length}개 오답·미응답</span></div><div class="review-list">${r.items.map(it=>reviewCard(it,result)).join('')}</div>`}
function reviewCard(it,record){const {q,a,ok,has}=it;return `<article class="review-card"><div class="r-meta"><span>${record.stage}차 ${q.id}번</span><span class="status ${ok?'yes':'no'}">${ok?'정답':'오답'}</span><span>${esc(q.topic)} · ${it.pts}점</span></div><h3>${esc(q.stem)}</h3><div class="mine">내 답: ${esc(displayAnswer(q,a))}</div><div class="correct">정답: ${esc(q.type==='보기 선택'?`${q.answerIndex}번 · ${q.answer}`:q.answer)}</div><p>${esc(q.why)}<br>${esc(q.wrong)}<br>기억할 개념: ${esc(q.memo)}</p><p style="font-size:11px">수행준거: ${esc(q.sub)} ${esc(q.crit)} · 난이도 ${esc(q.level)}</p>${q.type==='단답형'&&!ok?`<button class="btn outline btn-small" onclick="override(${q.id})">동의어 정답 인정 (수동)</button>`:''}</article>`}
function override(id){if(!result)return;if(!result.overrides)result.overrides={};result.overrides[id]=true;const item=history.find(x=>x.id===result.id);if(item){item.overrides={...result.overrides};let r=getResult(result.stage,result.answers,result.overrides);item.score=r.total;item.correct=r.correct;localStorage.setItem(HISTORY_KEY,JSON.stringify(history));delete wrong[`${result.stage}-${id}`];localStorage.setItem(WRONG_KEY,JSON.stringify(wrong))}toast('해당 단답형을 정답으로 인정했습니다.');render()}
function historyPage(){return `<div class="section-heading"><h2>성적 기록</h2><span>최근 ${history.length}회 저장됨</span></div>${history.length?`<div class="history-list">${history.map((r,i)=>`<div class="history-row"><div><b>${r.stage}차 · ${r.mode==='exam'?'실전':'학습'} 모드</b><small>${new Date(r.finished).toLocaleString('ko-KR')} · 정답 ${r.correct}문항</small></div><strong>${r.score}점</strong><button class="btn btn-small outline" onclick="result=history[${i}];go('result')">해설</button></div>`).join('')}</div>`:'<div class="panel empty"><b>채점한 시험이 없습니다.</b>첫 번째 모의고사를 풀어보세요.</div>'}<div class="paper-panel"><h3>오답 학습</h3><p>틀렸던 문제 ${Object.keys(wrong).length}개가 기기에 보관되어 있습니다.</p><div class="inline-actions"><button class="btn ghost btn-small" onclick="go('wrong')">오답노트 열기</button><button class="btn outline btn-small" onclick="go('home')">새 시험 보기</button></div></div><div class="paper-panel"><h3>데이터 보관 안내</h3><p>기기 내 브라우저에만 저장합니다. 다른 휴대폰·브라우저와 자동 동기화되지 않습니다.</p><div class="inline-actions"><button class="btn outline btn-small" onclick="exportData()">성적 기록 백업(JSON)</button><button class="btn outline btn-small" onclick="importData()">백업 복원</button><input type="file" id="restore-file" accept="application/json,.json" hidden onchange="restoreFile(this)"></div></div>`}
function wrongPage(){const data=Object.values(wrong).sort((a,b)=>b.when-a.when);return `<div class="section-heading"><h2>오답노트</h2><span>${data.length}문항 저장</span></div>${data.length?`<div class="review-list">${data.map(it=>{const q=questions(it.stage).find(q=>q.id===it.id);return `<article class="review-card error-review"><div class="r-meta">${it.stage}차 ${it.id}번 · ${esc(q.topic)} · ${esc(q.level)}</div><h3>${esc(q.stem)}</h3><div class="mine">당시 답: ${esc(displayAnswer(q,it.mine))}</div><div class="correct">정답: ${esc(q.type==='보기 선택'?`${q.answerIndex}번 · ${q.answer}`:q.answer)}</div><p>${esc(q.why)}<br>헷갈리는 개념: ${esc(q.wrong)}<br>암기: ${esc(q.memo)}</p><p style="font-size:11px">${esc(q.sub)} · 수행준거 ${esc(q.crit)}</p><button class="btn outline btn-small" onclick="removeWrong('${it.stage}-${it.id}')">복습 완료 · 목록에서 제거</button></article>`}).join('')}</div>`:'<div class="panel empty"><b>저장된 오답이 없습니다.</b>시험을 채점하면 틀린 문제가 이곳에 모입니다.</div>'}<div class="inline-actions"><button class="btn outline" onclick="go('history')">성적 기록</button><button class="btn primary" onclick="go('home')">새 모의고사 시작</button></div>`}
function removeWrong(id){delete wrong[id];localStorage.setItem(WRONG_KEY,JSON.stringify(wrong));render()}
function exportData(){const obj={appState,history,wrong,version:2};const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='정보보안산업기사_V1_학습기록.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importData(){$('restore-file')?.click()}
async function restoreFile(input){const f=input.files?.[0];if(!f)return;try{const v=JSON.parse(await f.text());if(!Array.isArray(v.history)||typeof v.wrong!=='object')throw Error('백업 형식이 맞지 않습니다');if(!confirm('현재 기록을 백업 파일 내용으로 교체할까요?'))return;history=v.history;wrong=v.wrong;appState=v.appState||null;localStorage.setItem(HISTORY_KEY,JSON.stringify(history));localStorage.setItem(WRONG_KEY,JSON.stringify(wrong));save();go('history');toast('기록을 복원했습니다.')}catch(e){toast('복원 실패: '+e.message)}}
function render(){const elem=$('app');if(screen==='home')elem.innerHTML=home();else if(screen==='setup')elem.innerHTML=setupPage();else if(screen==='exam')elem.innerHTML=examPage();else if(screen==='result')elem.innerHTML=resultPage();else if(screen==='history')elem.innerHTML=historyPage();else if(screen==='wrong')elem.innerHTML=wrongPage();if(screen==='exam'){ensureTimer();const q=questions(appState.stage)[current];if(q.type==='단답형'){let inp=$('shortanswer');inp?.addEventListener('input',e=>{appState.answers[q.id]=e.target.value;save();const count=questions(appState.stage).filter(filled).length;const pct=Math.round(count/questions(appState.stage).length*100);const b=document.querySelector('.bar i');if(b)b.style.width=pct+'%';const prog=document.querySelector('.progress-info span');if(prog)prog.textContent=count+'/'+questions(appState.stage).length+'문항 답변 완료'})}}else{clearInterval(tick);tick=null}}
init();
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
 window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
</script>
</body></html>
