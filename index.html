function pickUnused(pool,n,rng,locked,globalDay,stage){

 }
 return chosen;
}

    q.explain=`정답은 ${item.term}입니다. ${item.definition}`;q.memory=item.term+' ↔ '+item.definition;
  }
 }else if(kind==='진위형'){
   const isTrue=v%2===0,other=getWrongDefinition(item,rng),def=isTrue?item.definition:other.definition;
   const starts=['아래 설명이 옳으면 O, 틀리면 X를 고르세요.','다음 용어와 설명의 연결이 정확한지 판단하세요.','다음 진술이 보안 용어의 뜻과 맞는지 고르세요.','다음 문장이 맞으면 O, 아니면 X입니다.'];
   q.stem=`${starts[Math.floor(v/2)%starts.length]}\n${item.term}은(는) ${def}`;
   q.options=['O','X'];q.correct=isTrue?0:1;q.explain=`${item.term}: ${item.definition}`;q.memory=item.term+' ↔ '+item.definition;
 }else if(kind==='단답형'){
   q.stem=`${SHORT_STEMS[v%SHORT_STEMS.length]}\n${item.definition}`;
   q.correct=item.term;q.explain=`${item.term}: ${item.definition}`;q.memory=item.term+' ↔ '+item.definition;
 }else if(kind==='연결형'){
   const anchors=[anchor,...matched];const defs=shuffle(anchors.map(x=>x.item.definition),rng);
   q.stem=['다음 보안 용어와 설명을 올바르게 연결하세요.','다음 보안 기술과 그 기능을 알맞게 짝지으세요.','아래 용어와 정의의 일치 관계를 선택하세요.'][v%3];
   q.terms=anchors.map(a=>a.item.term);q.definitions=defs;q.correct=q.terms.map((term)=>defs.indexOf(anchors.find(a=>a.item.term===term).item.definition));
   q.explain=anchors.map(a=>`${a.item.term}: ${a.item.definition}`).join(' / ');q.memory=anchors.map(a=>a.item.term).join(' · ');
 }
 return q;
}
function otherStageConcepts(day,stage){
 const other=sessions[`${day}/${stage===1?2:1}`];if(!other)return [];return [...new Set(other.questions.flatMap(q=>[q.concept,...(q.terms||[]).map(t=>DB.find(z=>z.term===t)?.id).filter(Boolean)]))];
}
function allocateFirst(rng,day){
 const locked=new Set(otherStageConcepts(day,1)),grouped=[];
 for(let section=0;section<24;section++){
    const got=pickUnused(DB.filter(q=>q.section===section),1,rng,locked,0,1);
    if(got.length)grouped.push(...got);
 }
 const rest=pickUnused(DB,40-grouped.length,rng,locked,0,1);
 const all=shuffle([...grouped,...rest],rng);
 if(all.length!==40)throw Error('새 문제은행이 부족합니다. 관리자에게 문제 추가가 필요합니다.');
 const forms=shuffle([...Array(20).fill('4지택일'),...Array(8).fill('진위형'),...Array(2).fill('연결형'),...Array(10).fill('단답형')],rng);
 // 1~30 are objective question types, 31~40 short answer, for stable point values.
 const objective=shuffle([...Array(20).fill('4지택일'),...Array(8).fill('진위형'),...Array(2).fill('연결형')],rng);
 const ordered=[...objective,...Array(10).fill('단답형')];
 const qq=[];
 for(let i=0;i<40;i++){
   const anchor=all[i];let matches=[];
   if(ordered[i]==='연결형')matches=pickUnused(DB.filter(z=>z.id!==anchor.item.id),2,rng,new Set([...locked]),0,1);
   if(ordered[i]==='연결형'&&matches.length!==2)throw Error('연결형 추가 문항을 확보하지 못했습니다');
   const q=makeOne(anchor,ordered[i],i+1,rng,matches);qq.push(q);used[anchor.key]=true;
   // Matched terms are incidental; they do not count as a repeated standalone question.
 }
 return {questions:qq,bank:null};
}
function allocateSecond(rng,day){
 const locked=new Set(otherStageConcepts(day,2));let chosen=pickUnused(DB,20,rng,locked,0,2);
 if(chosen.length!==20)throw Error('2차 문제은행이 부족합니다. 새로운 문제 추가가 필요합니다.');
 const terms=chosen.map(x=>x.item.term),excluded=new Set(chosen.map(x=>x.item.id));
 const distractors=shuffle(DB.filter(x=>!excluded.has(x.id)),rng).slice(0,19).map(x=>x.term);
 const bank=shuffle([...terms,...distractors],rng);
 if(new Set(bank).size!==39)throw Error('2차 보기 중복 오류');
 let qs=chosen.map((anchor,i)=>{const {item,v,key}=anchor;
  const intro=SHORT_STEMS[v%SHORT_STEMS.length];
  used[key]=true;return {id:i+1,kind:'보기 선택',term:item.term,concept:item.id,topic:item.topic,sub:item.sub,crit:item.crit,level:v%4===0?'중':'중하',stem:`${intro}\n${item.definition}`,correct:bank.indexOf(item.term),explain:`${item.term}: ${item.definition}`,memory:item.term+' ↔ '+item.definition,unique:key};});
 return {questions:qs,bank};
}
function createSession(stage,selectedMode){
 const day=nowDate(),id=`${day}/${stage}`,saved=sessions[id];if(saved)return saved;
 const rng=random(hash(day+' '+stage+' 2026-v1-v1'));
 const built=stage===1?allocateFirst(rng,day):allocateSecond(rng,day);
 const stems=built.questions.map(q=>norm(q.stem+" | "+(q.terms||[]).join(" | ")));
 if(new Set(stems).size!==stems.length)throw Error('동일한 문제 내용이 포함되어 있습니다.');
 const s={id,date:day,stage,mode:selectedMode,questions:built.questions,bank:built.bank,answers:{},current:0,created:Date.now(),finished:null,score:null};sessions[id]=s;persist();return s;
}
function go(where){view=where;window.scrollTo({top:0,behavior:'instant'});render()}
function openStage(stage,selectedMode='exam'){
 try{active=createSession(stage,selectedMode);qindex=active.current||0;go(active.finished?'result':'exam')}
 catch(e){alert('새 회차 생성 실패: '+e.message)}
}
function answersCount(s){return s.questions.filter(q=>answered(s,q)).length}
function answered(s,q){const a=s.answers[q.id];return Array.isArray(a)?a.length===3&&a.every(v=>Number.isInteger(v)&&v>=0):a!==undefined&&a!==null&&String(a).trim()!==''}
function shortCorrect(value,term){const aliases=[term];const match=term.match(/^(.*?)\((.*?)\)$/);if(match){aliases.push(match[1].trim(),match[2].trim())}
 if(term==='크로스 사이트 스크립팅(XSS)')aliases.push('XSS');
 if(term==='웹 애플리케이션 방화벽(WAF)')aliases.push('WAF');
 if(term==='가상사설망(VPN)')aliases.push('VPN');
 if(term==='정보자산')aliases.push('자산');
 if(term==='취약점')aliases.push('취약성');
 if(term==='시큐어 코딩')aliases.push('시큐어코딩');
 return aliases.some(s=>norm(s)===norm(value));}
function check(s,q){if(!answered(s,q))return false;let a=s.answers[q.id];if(q.kind==='단답형')return shortCorrect(a,q.correct);if(q.kind==='연결형')return a.every((v,i)=>Number(v)===q.correct[i]);return Number(a)===q.correct}
function calc(s){let score=0,right=0;const items=s.questions.map(q=>{const ok=check(s,q),points=s.stage===2?5:q.id<=30?2:4;if(ok){score+=points;right++}return {q,ok,points,answer:s.answers[q.id]};});return{score,right,items}}
function pick(index,value){if(!active||active.finished)return;active.answers[index]=value;persist();render()}
function pickMatch(i,value){const q=active.questions[qindex];let a=Array.isArray(active.answers[q.id])?[...active.answers[q.id]]:[-1,-1,-1];a[i]=Number(value);pick(q.id,a)}
function writeAnswer(value){if(!active||active.finished)return;active.answers[active.questions[qindex].id]=value;persist();refreshProgress()}
function navigate(i){if(!active)return;active.current=i;qindex=i;persist();window.scrollTo({top:0,behavior:'instant'});render()}
function secondsLeft(){return Math.max(0,5400-Math.floor((Date.now()-active.created)/1000))}
function displayTime(n){let m=Math.floor(n/60),s=n%60;return`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function stopTimer(){if(timerHandle){clearInterval(timerHandle);timerHandle=null}}
function startTimer(){stopTimer();if(!active||active.finished||active.mode==='learn')return;const update=()=>{if(view!=='exam'||!active)return;let n=secondsLeft();const el=document.getElementById('timer');if(el){el.textContent=displayTime(n);el.classList.toggle('urgent',n<600)}if(n===0){stopTimer();submit(true)}};update();timerHandle=setInterval(update,1000)}
function submit(auto=false){if(!active||active.finished)return;const answeredN=answersCount(active);if(!auto&&!confirm(`${answeredN}/${active.questions.length}문항 답변했습니다. 제출하여 채점하시겠습니까?`))return;const r=calc(active);active.finished=Date.now();active.score=r.score;persist();stopTimer();go('result')}
function home(){const day=nowDate();const done=Object.values(sessions).filter(s=>s.finished);return `<section class="hero"><span class="badge">2026년 12월 외부평가 대비 · V1</span><h1>하루 한 회차,<br>매일 달라지는 보안 문제</h1><p>오늘 ${esc(day)} · 1차 40문항 · 2차 20문항. 이전에 풀었던 동일한 문제 문장을 회차에 다시 넣지 않도록 관리합니다.</p></section><div class="panel" style="border:1.5px solid #e4d2ae;background:#fff9ef"><div class="row"><div><h2 style="font-size:19px">📅 12월 2일까지 17일 공부 코치</h2><p class="sub">매일 날짜별 공부 주제 · 과제 체크 · 점수와 오답 보고</p></div><a class="button" href="./plan.html">오늘 할 일 확인</a></div></div><div class="panel" style="border:1.5px solid #a5ddd8;background:#f2fbf8"><div class="row"><div><h2 style="font-size:19px">📘 하루 10분 핵심 암기장</h2><p class="sub">V1 기본 보안 개념 146개 · 오늘 10개/20개 · 다시 외울 개념 복습</p></div><a class="button" href="./memorize.html">암기 시작하기</a></div></div><div class="panel" style="border:1.5px solid #f0dec1;background:#fff9ec"><div class="row"><div><h2 style="font-size:18px">🔁 틀린 개념 재확인</h2><p class="sub">채점 후 오답 개념 자동 추출 · 다음 날 → 3일 뒤 → 7일 뒤 반복</p></div><a class="button gray" href="./review.html">오늘 오답 복습</a></div></div><div class="notice">난이도 하~중 · 계산형 제외 · 8개 주요항목과 24개 세부항목의 기본 개념 중심. 중요한 개념은 다른 질문 형태로 다시 나올 수 있습니다.</div><div class="cards">${[1,2].map(stage=>{let ss=sessions[`${day}/${stage}`],n=stage===1?40:20;let status=ss?(ss.finished?`오늘 완료 · ${ss.score}점`:`진행 중 · ${answersCount(ss)}/${n}문항`):'오늘의 새 문제 준비됨';return `<section class="card"><div class="row"><span class="pill">${stage}차 평가</span><span class="fine">${stage===1?'4지·O/X·연결·단답':'39개 통합 보기'}</span></div><h2>${n}문항</h2><p>${status}<br>90분 실전 모드 또는 시간 무제한 학습 모드</p><div class="row" style="align-items:stretch"><button class="button ${ss?.finished?'secondary':''}" style="flex:1" onclick="openStage(${stage},'exam')">${ss?ss.finished?'오늘 해설 보기':'이어 풀기':'실전 시작'}</button>${!ss?`<button class="button gray" onclick="openStage(${stage},'learn')">학습</button>`:''}</div></section>`}).join('')}</div><div class="panel"><div class="row"><h2>학습 기록</h2><span class="pill">${done.length}회 완료</span></div><p class="sub">기기 내 기록을 보관합니다. 날짜가 바뀌면 새로운 회차를 선택할 수 있습니다.</p><button class="button gray small" onclick="go('history')">지난 성적·오답 보기</button></div><div class="warnbox">공식 출제문항이 아니라 V1 출제기준을 바탕으로 만든 자체 연습문제입니다. 문제은행에는 유한한 문항이 있으며 소진될 경우 반복하지 않고 문제 추가가 필요하다고 알립니다.</div>`}
function options(q,s){const value=s.answers[q.id];
 if(q.kind==='단답형')return `<label for="short-answer" class="muted">정확한 용어를 적으세요.</label><input id="short-answer" class="input" type="text" value="${esc(value||'')}" placeholder="답안 입력" oninput="writeAnswer(this.value)" autocomplete="off">`;
 if(q.kind==='연결형')return `<p class="sub">①~③ 용어에 맞는 설명을 ㉠~㉢에서 연결하세요. 3개를 모두 맞혀야 정답입니다.</p>${q.terms.map((t,i)=>`<label class="match"><span>${i+1}. ${esc(t)}</span><select onchange="pickMatch(${i},this.value)"><option value="-1">선택</option>${['㉠','㉡','㉢'].map((label,j)=>`<option value="${j}" ${Array.isArray(value)&&value[i]===j?'selected':''}>${label}</option>`).join('')}</select></label>`).join('')}<div class="matchbank">${q.definitions.map((d,i)=>`<p>${['㉠','㉡','㉢'][i]}. ${esc(d)}</p>`).join('')}</div>`;
 if(q.kind==='보기 선택')return `<details class="expand" ${value===undefined?'open':''}><summary>통합 보기 39개에서 선택하기</summary><div class="bank">${s.bank.map((term,i)=>`<label class="choice"><input type="radio" name="answer" value="${i}" onchange="pick(${q.id},${i})" ${value===i?'checked':''}><span><b>${i+1}.</b> ${esc(term)}</span></label>`).join('')}</div></details>${value!==undefined?`<div class="notice">선택: ${value+1}번 · ${esc(s.bank[value])}</div>`:''}`;
 return q.options.map((o,i)=>`<label class="choice"><input type="radio" name="answer" onchange="pick(${q.id},${i})" ${value===i?'checked':''}><span><b>${q.kind==='진위형'?['①','②'][i]:['①','②','③','④'][i]}</b> ${esc(o)}</span></label>`).join('')}
function refreshProgress(){if(!active)return;const n=answersCount(active),el=document.getElementById('answer-progress');if(el)el.textContent=`${n}/${active.questions.length}문항 답변`;const bar=document.getElementById('progress-indicator');if(bar)bar.style.width=`${n/active.questions.length*100}%`;const btn=document.querySelector(`[data-no="${qindex}"]`);if(btn)btn.classList.toggle('done',answered(active,active.questions[qindex]));}
function exam(){const s=active;if(!s||s.finished)return home();const q=s.questions[qindex],num=answersCount(s);return `<div class="row"><div><div class="fine">${s.date} · ${s.stage}차 · ${s.mode==='exam'?'90분 실전':'시간 무제한 학습'}</div><h2>오늘의 모의고사</h2></div><span id="timer" class="timer">${s.mode==='exam'?displayTime(secondsLeft()):'학습 모드'}</span></div><div id="answer-progress" class="fine" style="margin-top:14px">${num}/${s.questions.length}문항 답변</div><div class="progress"><i id="progress-indicator" style="width:${num/s.questions.length*100}%"></i></div><section class="panel"><div class="row"><span class="pill">${q.kind} · ${s.stage}차 ${q.id}번 / ${s.questions.length}</span><span class="fine">${q.topic} · ${q.level}</span></div><div class="question">${esc(q.stem)}</div>${options(q,s)}<div class="actions"><button class="button gray small" onclick="navigate(${Math.max(0,qindex-1)})" ${qindex===0?'disabled':''}>이전 문제</button>${qindex===s.questions.length-1?`<button class="button" onclick="submit()">시험 제출·채점</button>`:`<button class="button" onclick="navigate(${qindex+1})">다음 문제</button>`}</div></section><div class="panel"><p class="fine">문항 번호 바로 이동</p><div class="qnav">${s.questions.map((x,i)=>`<button data-no="${i}" class="${i===qindex?'current':''} ${answered(s,x)?'done':''}" onclick="navigate(${i})">${i+1}</button>`).join('')}</div><div class="row"><button class="button gray small" onclick="go('home')">홈으로</button><button class="button warn small" onclick="submit()">제출·채점하기</button></div></div>`}
function humanAnswer(q,s,a){if(a===undefined||a===null||a===''||Array.isArray(a)&&a.every(v=>v===-1))return '미응답';if(q.kind==='연결형')return a.map((x,i)=>`${i+1}-${x<0?'미선택':['㉠','㉡','㉢'][x]}`).join(', ');if(q.kind==='보기 선택')return `${Number(a)+1}번 · ${s.bank[Number(a)]||'알 수 없음'}`;if(q.kind==='단답형')return String(a);return q.options[Number(a)]||'미응답'}
function correctAnswer(q,s){if(q.kind==='연결형')return q.correct.map((a,i)=>`${i+1}-${['㉠','㉡','㉢'][a]}`).join(', ');if(q.kind==='단답형')return q.correct;if(q.kind==='보기 선택')return `${q.correct+1}번 · ${s.bank[q.correct]}`;return `${q.correct+1}번 · ${q.options[q.correct]}`}
function reviewCards(s,onlyWrong=false){return calc(s).items.filter(x=>!onlyWrong||!x.ok).map(({q,ok,answer,points})=>`<section class="review"><div class="row"><span class="pill">${s.stage}차 ${q.id}번 · ${q.kind} · ${points}점</span><b class="${ok?'correct':'wrong'}">${ok?'정답':'오답·미응답'}</b></div><div class="stem">${esc(q.stem)}</div><p>내 답: ${esc(humanAnswer(q,s,answer))}</p><p class="correct">정답: ${esc(correctAnswer(q,s))}</p><p class="sub">${esc(q.explain)}</p><p class="fine">${esc(q.topic)} · ${esc(q.sub)} · 수행준거 ${esc(q.crit)} · ${q.level}</p></section>`).join('')||'<div class="panel">오답이 없습니다.</div>'}
function resultPage(){const s=active;if(!s||!s.finished)return home();const r=calc(s);return `<div class="panel"><div class="row"><div><div class="fine">${esc(s.date)} · ${s.stage}차 채점 결과</div><h1>오늘의 모의고사 완료</h1></div><span class="pill">${s.mode==='exam'?'실전':'학습'} 모드</span></div><div class="score">${r.score}<small style="font-size:20px"> / 100점</small></div><p class="muted">정답 ${r.right}/${s.questions.length}문항 · 자체 연습용 점수</p><div class="actions"><a class="button" href="./plan.html">오늘 공부 체크리스트 확인</a><a class="button" href="./review.html?source=${encodeURIComponent(s.id)}">틀린 개념 바로 복습하기</a><button class="button secondary small" onclick="go('home')">홈으로</button><button class="button gray small" onclick="go('history')">성적 기록</button></div><p class="sub">복습 페이지에서 틀린 문제를 다시 확인하고 다음 복습 날짜를 지정할 수 있습니다.</p></div><div class="row" style="margin-top:22px"><h2>정답·해설</h2><div><button class="button small ${reviewFilter==='wrong'?'':'gray'}" onclick="reviewFilter='wrong';render()">오답만</button> <button class="button small ${reviewFilter==='all'?'':'gray'}" onclick="reviewFilter='all';render()">전체</button></div></div><div class="reviews">${reviewCards(s,reviewFilter==='wrong')}</div>`}
function historyPage(){const list=Object.values(sessions).filter(s=>s.finished).sort((a,b)=>b.finished-a.finished);return `<div class="row"><h1>지난 성적</h1><button class="button gray small" onclick="go('home')">홈으로</button></div><p class="sub">완료된 회차 ${list.length}개 · 저장된 문제와 해설을 그대로 다시 확인할 수 있습니다.</p><div class="history">${list.map(s=>`<button onclick="active=sessions['${s.id}'];reviewFilter='all';go('result')"><span><b>${s.date} · ${s.stage}차</b><br><span class="fine">${s.mode==='exam'?'실전':'학습'} 모드 · ${new Date(s.finished).toLocaleString('ko-KR')}</span></span><b>${s.score}점</b></button>`).join('')||'<div class="panel">아직 완료한 시험이 없습니다.</div>'}</div>`}
function render(){stopTimer();let el=document.getElementById('app');el.innerHTML=view==='home'?home():view==='exam'?exam():view==='result'?resultPage():historyPage();if(view==='exam')startTimer()}
render();
</script></body></html>
